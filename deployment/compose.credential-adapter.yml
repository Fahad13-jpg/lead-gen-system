# Internal service fragment. The future gateway must join credentials_private.
# No published port, n8n API token, database access or Docker socket.
services:
  credential-adapter:
    build:
      context: ..
      dockerfile: deployment/credential-adapter.Dockerfile
    image: ${CREDENTIAL_ADAPTER_IMAGE:-leadgen-credential-adapter:20261117}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    environment:
      CREDENTIAL_ADAPTER_TOKEN_FILE: /run/secrets/credential-adapter-token
    secrets:
      - credential-adapter-token
    volumes:
      - n8n_runtime:/home/node/.n8n:ro
    networks: [credentials_private]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3013/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
secrets:
  credential-adapter-token:
    file: ${CREDENTIAL_ADAPTER_TOKEN_FILE:?Set the adapter token file}
volumes:
  n8n_runtime:
    external: true
    name: ${N8N_DATA_VOLUME:?Set the existing n8n persistent volume}
networks:
  credentials_private:
    internal: true
